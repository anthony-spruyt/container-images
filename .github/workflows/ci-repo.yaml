# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Repo-owned CI jobs; ci.yaml calls this after lint. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md

name: "CI (repo)"
on:
  workflow_call: {}
permissions: {}
jobs:
  factory-tests:
    name: "MegaLinter Factory Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: anthony-spruyt/repo-operator/.github/actions/harden-runner@766304fb089600d37bc7a191eeb9befb32799b5a
        with:
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run tests"
        run: |
          pip install -q --require-hashes --only-binary :all: \
            -r megalinter-factory/requirements.txt \
            -r megalinter-factory/requirements-test.txt
          python -m pytest megalinter-factory/ -q
