---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Container Retention Policy

on:
  schedule:
    - cron: "0 5 * * 0" # Weekly, Sundays at 5 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no deletions)"
        type: boolean
        default: true

jobs:
  cleanup-containers:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.CONTAINER_RETENTION_TOKEN }}
          package: megalinter-*
          expand-packages: true
          older-than: 4 weeks
          keep-n-tagged: 5
          delete-ghost-images: true
          delete-partial-images: true
          dry-run: ${{ inputs.dry_run || 'false' }}

  cleanup-releases:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GARBO_CLIENT_ID }}
          private-key: ${{ secrets.GARBO_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          CUTOFF_DATE=$(date -d '4 weeks ago' +%s)
          KEEP_N=5

          # Tags naming a version release-please still considers current must
          # survive regardless of age: deleting one would make release-please
          # lose its version anchor and recut a version that already shipped.
          CURRENT_TAGS=$(jq -r '
            to_entries[]
            | "\(.key)-\(if (.key | startswith("megalinter-container-images")
                or startswith("megalinter-spruyt-labs")
                or startswith("megalinter-xfg")) then "v" else "" end)\(.value)"
          ' .release-please-manifest.json)

          for PREFIX in megalinter-; do
            echo "Processing releases with prefix: $PREFIX"

            # Get all releases for this prefix, sorted by date (newest first)
            RELEASES=$(gh release list --repo ${{ github.repository }} --limit 1000 \
              --json tagName,createdAt \
              --jq ".[] | select(.tagName | startswith(\"$PREFIX\"))")

            # Count and track for keeping N most recent
            COUNT=0

            echo "$RELEASES" | jq -c '.' | while read -r RELEASE; do
              TAG=$(echo "$RELEASE" | jq -r '.tagName')
              CREATED=$(echo "$RELEASE" | jq -r '.createdAt')
              CREATED_TS=$(date -d "$CREATED" +%s)

              COUNT=$((COUNT + 1))

              # Keep N most recent regardless of age
              if [ "$COUNT" -le "$KEEP_N" ]; then
                echo "Keeping (recent): $TAG"
                continue
              fi

              # Keep whatever release-please currently points at
              if echo "$CURRENT_TAGS" | grep -qxF "$TAG"; then
                echo "Keeping (current release-please version): $TAG"
                continue
              fi

              # Delete if older than cutoff
              if [ "$CREATED_TS" -lt "$CUTOFF_DATE" ]; then
                if [ "$DRY_RUN" = "true" ]; then
                  echo "Would delete: $TAG (created: $CREATED)"
                else
                  echo "Deleting: $TAG (created: $CREATED)"
                  gh release delete "$TAG" --repo ${{ github.repository }} --cleanup-tag --yes
                fi
              else
                echo "Keeping (not old enough): $TAG"
              fi
            done
          done
