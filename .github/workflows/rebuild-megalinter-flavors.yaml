---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Rebuild MegaLinter Flavors

# Flavors only release when their directory changes; see docs/releases.md
on:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sunday at 4 AM UTC
  push:
    branches:
      - main
    paths:
      - "megalinter-factory/base.yaml"
      - "megalinter-factory/languages/**"
  workflow_dispatch:

permissions: {}

# Runs read the open refresh PR to supersede it, so two must not overlap
concurrency:
  group: rebuild-megalinter-flavors
  cancel-in-progress: false

jobs:
  refresh:
    name: Open refresh pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # App token: a GITHUB_TOKEN PR triggers no status checks, so it could never merge
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find flavor directories
        id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # Modified only: a newly added definition changes no flavor until its flavor.yaml lists it.
            # Stamps the push already wrote (a breaking removal releases its own flavors) are skipped.
            DIFF=$(git diff --name-only --diff-filter=M "$BEFORE" "$SHA"
              git diff --name-only "$BEFORE" "$SHA" -- 'megalinter-*/.rebuild-stamp')
            mapfile -t CHANGED <<< "$DIFF"
            pip install -q --require-hashes --only-binary :all: \
              -r megalinter-factory/requirements.txt
            FOUND=$(python megalinter-factory/compose.py "${CHANGED[@]}")
            echo "suffix=-${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "message=chore(megalinter): rebuild flavors for updated language definitions" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 2 -name 'flavor.yaml' -printf '%h\n' | sed 's|^\./||')
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "message=chore(megalinter): weekly linter version refresh" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FOUND" ]; then
            echo "flavors=[]" >> "$GITHUB_OUTPUT"
            echo "superseded=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An open refresh PR stamps the same lines; fold its flavors in and supersede it
          OPEN=$(gh pr list --state open --base main --json number,headRefName,files \
            --jq '[.[] | select(.headRefName | startswith("chore/megalinter-refresh-"))]')
          SUPERSEDED=$(jq -r '[.[].number] | join(" ")' <<< "$OPEN")
          CARRIED=$(jq -r '.[].files[].path | select(test("^megalinter-[^/]+/\\.rebuild-stamp$")) | split("/")[0]' <<< "$OPEN")
          echo "superseded=$SUPERSEDED" >> "$GITHUB_OUTPUT"

          FLAVORS=$(printf '%s\n%s\n' "$FOUND" "$CARRIED" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')
          echo "Found flavors: $FLAVORS"
          echo "flavors=$FLAVORS" >> "$GITHUB_OUTPUT"

      - name: Stamp each flavor
        env:
          FLAVORS: ${{ steps.find.outputs.flavors }}
          SUFFIX: ${{ steps.find.outputs.suffix }}
        run: |
          STAMP="$(date -u +%Y-%m-%d)${SUFFIX}"
          echo "$FLAVORS" | jq -r '.[]' | while read -r flavor; do
            echo "$STAMP" > "${flavor}/.rebuild-stamp"
            echo "Stamped $flavor with $STAMP"
          done

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUFFIX: ${{ steps.find.outputs.suffix }}
          MESSAGE: ${{ steps.find.outputs.message }}
          SUPERSEDED: ${{ steps.find.outputs.superseded }}
        run: |
          # Not `git diff`: a flavor whose stamp does not exist yet is untracked,
          # and an untracked file is invisible to both `git diff` and `git commit -a`.
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Stamps are already current, nothing to do"
            exit 0
          fi

          BRANCH="chore/megalinter-refresh-$(date -u +%Y%m%d)${SUFFIX}"
          BASE=$(git rev-parse HEAD)
          git add -A
          ENTRIES=$(git diff --cached --name-only | while read -r path; do
            jq -n --arg path "$path" --rawfile content "$path" \
              '{path: $path, mode: "100644", type: "blob", content: $content}'
          done | jq -s -c .)
          TREE=$(jq -n --arg base "$(git rev-parse 'HEAD^{tree}')" --argjson tree "$ENTRIES" \
            '{base_tree: $base, tree: $tree}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          # GitHub signs an API commit as the app only when no author or committer is passed
          COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message="$MESSAGE" -f tree="$TREE" -f "parents[]=$BASE" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$COMMIT" --silent

          URL=$(gh pr create \
            --title "$MESSAGE" \
            --body "Bumps each flavor's rebuild stamp so release-please cuts a patch release and the images rebuild against the current linter versions." \
            --base main \
            --head "$BRANCH")

          for number in $SUPERSEDED; do
            gh pr close "$number" --delete-branch --comment "Superseded by $URL, which stamps these flavors too."
          done
