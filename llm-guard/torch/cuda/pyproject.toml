[project]
name = "llm-guard-torch-cuda"
version = "0.0.0"
dependencies = ["torch==2.14.1+cu130"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

# explicit: only torch comes from this index, whose copies of other packages carry no hashes.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
