---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Build Image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (directory, also the GHCR package name)"
        required: true
        type: string
      push:
        description: "Publish the image and the release. Off for pull request checks."
        required: false
        type: boolean
        default: false
      version:
        description: "Version to publish, without a leading v (e.g., 1.0.7). Required when push is true."
        required: false
        type: string
        default: ""
      tag-name:
        description: "Git tag release-please created (e.g., llm-guard-cuda/v1.0.7). Required when push is true."
        required: false
        type: string
        default: ""
      tag-prefix:
        description: "Prefix for the docker tag only ('' or 'v'). Downstream repos pin these."
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

concurrency:
  group: build-${{ inputs.image }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.push && 'Build and publish' || 'Build' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the draft release
      packages: write # Push to GHCR
      id-token: write # OIDC for attestations
      attestations: write # Build provenance
      security-events: write # SARIF upload to GitHub code scanning
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: ${{ inputs.tag-name }}

      - name: Free up disk space
        run: |
          # Remove unnecessary tools and packages to free disk space for large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Prepare build context
        id: context
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          # Optional build_context: build against another image's directory
          # using this image's own Dockerfile (variant images sharing sources).
          BUILD_CONTEXT=$(yq -r '.build_context // ""' "$IMAGE_NAME/metadata.yaml")
          if [ -n "$BUILD_CONTEXT" ]; then
            if ! echo "$BUILD_CONTEXT" | grep -qE '^[a-zA-Z0-9_-]+$'; then
              echo "::error::Invalid build_context format in $IMAGE_NAME/metadata.yaml: $BUILD_CONTEXT"
              exit 1
            fi
            if [ ! -d "$BUILD_CONTEXT" ]; then
              echo "::error::build_context directory does not exist: $BUILD_CONTEXT"
              exit 1
            fi
            echo "::notice::Building $IMAGE_NAME from context $BUILD_CONTEXT"
            echo "path=$BUILD_CONTEXT" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$IMAGE_NAME/Dockerfile" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "path=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$IMAGE_NAME/Dockerfile" >> "$GITHUB_OUTPUT"

      - name: Generate flavor files
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          if [ -f "$IMAGE_NAME/flavor.yaml" ]; then
            echo "::notice::Found flavor.yaml, generating Dockerfile and test.sh"
            pip install -q pyyaml jinja2
            python megalinter-factory/generate.py "$IMAGE_NAME"
          fi

      - name: Verify Dockerfile exists
        env:
          DOCKERFILE: ${{ steps.context.outputs.dockerfile }}
        run: |
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::No Dockerfile found at $DOCKERFILE"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-metadata
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag-prefix }}${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern=${{ inputs.tag-prefix }}{{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest
            type=sha,prefix=

      - name: Build image
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: ${{ steps.context.outputs.path }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        env:
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}:latest
        run: |
          TEST_SCRIPT="${IMAGE_NAME}/test.sh"
          if [ -f "$TEST_SCRIPT" ]; then
            echo "Running tests for $IMAGE_NAME..."
            chmod +x "$TEST_SCRIPT"
            "$TEST_SCRIPT" "$IMAGE_REF"
          else
            echo "No test script found at $TEST_SCRIPT, skipping"
          fi

      - name: Push image
        if: inputs.push
        id: push
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: ${{ steps.context.outputs.path }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate provenance attestation
        if: inputs.push
        uses: actions/attest-build-provenance@10334b5f1e684784025c3fc0a277c88c19089275
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Must stay last: on failure the release stays a draft, so a published
      # release always has an image behind it.
      - name: Publish release with image details
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag-name }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}:${{ inputs.tag-prefix }}${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          BODY=$(gh release view "$TAG" --json body --jq .body)
          {
            printf '%s\n\n' "$BODY"
            printf '## Container Image\n\n'
            # shellcheck disable=SC2016
            printf '```\n%s\n```\n\n' "$IMAGE_REF"
            # shellcheck disable=SC2016
            printf '**Digest:** `%s`\n\n' "$DIGEST"
            printf '**Run:** [#%s](%s/%s/actions/runs/%s)\n' \
              "$RUN_ID" "$SERVER_URL" "$REPO" "$RUN_ID"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false
