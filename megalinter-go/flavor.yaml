# MegaLinter Flavor Factory Configuration
# Source of truth for megalinter-go flavor
#
# To regenerate Dockerfile and test.sh:
#   python megalinter-factory/generate.py megalinter-go/
#
# Linter versions are automatically extracted from MegaLinter at build time.
---
name: go
description: "MegaLinter for Go repositories"

# Upstream MegaLinter base image (Renovate tracks this)
# renovate: datasource=docker depName=ghcr.io/oxsecurity/megalinter-ci_light
upstream_image: "ghcr.io/oxsecurity/megalinter-ci_light:v10.1.0@sha256:e40b320afe3152cd0e856019ff9c74a827d179ed45512148e5790871c3d08259"

# Additional linters not in base flavor
# Just list linter keys - versions come from MegaLinter automatically
custom_linters:
  - ACTION_ACTIONLINT
  - GO_GOLANGCI_LINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_PYLINT
  - SPELL_LYCHEE

# Upstream's go flavor installs Go from apk, which trails the go directive our modules declare
# renovate: datasource=docker depName=golang
go_image: "docker.io/library/golang:1.27.1-alpine@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414"

# GOTOOLCHAIN=local: a newer go directive must fail the run, not download a toolchain golangci-lint cannot load
# GOMODCACHE: the default under /go is root-owned, and lint.sh runs the container as the host user
extra_dockerfile: |
  COPY --link --from={{ flavor.go_image }} /usr/local/go /usr/lib/go
  ENV GOTOOLCHAIN=local \
      GOMODCACHE=/tmp/go/mod

extra_test_linters:
  - name: go
    version_command: "go version"

extra_test_env_vars:
  - name: GOTOOLCHAIN
    contains: "local"
