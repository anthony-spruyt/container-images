[project]
name = "llm-tool-guard"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.159.1",
    "httpx2==2.16.0",
    "uvicorn[standard]==0.54.0",
    "transformers==5.20.2",
    "tokenizers==0.23.3",
    "openvino==2026.4.1",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "redis==8.1.0",
    "prometheus-client==0.26.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
no-build = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
