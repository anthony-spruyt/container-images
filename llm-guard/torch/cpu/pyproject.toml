[project]
name = "llm-guard-torch-cpu"
version = "0.0.0"
dependencies = ["torch==2.14.1+cpu"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# explicit: only torch comes from this index, whose copies of other packages carry no hashes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
