---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Build Image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (directory, also the GHCR package name)"
        required: true
        type: string
      push:
        description: "Publish the image and the release. Off for pull request checks."
        required: false
        type: boolean
        default: false
      version:
        description: "Version to publish, without a leading v (e.g., 1.0.7). Required when push is true."
        required: false
        type: string
        default: ""
      tag-name:
        description: "Git tag release-please created (e.g., llm-guard-cuda/v1.0.7). Required when push is true."
        required: false
        type: string
        default: ""
      tag-prefix:
        description: "Prefix for the docker tag only ('' or 'v'). Downstream repos pin these."
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}

concurrency:
  group: build-${{ inputs.image }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ inputs.push && 'Build and publish' || 'Build' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the draft release
      packages: write # Push to GHCR
      id-token: write # OIDC for attestations
      attestations: write # Build provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The provenance attestation always names the run's commit (github.sha), so build only that commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag is the commit being built
        id: verify
        if: inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image }}
          TAG_NAME: ${{ inputs.tag-name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$TAG_NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::tag-name and version are required when push is true"
            exit 1
          fi
          if ! DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft); then
            echo "::error::No release found for ${TAG_NAME}."
            exit 1
          fi
          case "$DRAFT" in
            true) ;;
            false)
              echo "::notice::Release ${TAG_NAME} is already published; skipping the build"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unexpected isDraft '${DRAFT}' for ${TAG_NAME}"
              exit 1
              ;;
          esac
          if ! TAG_SHA=$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG_NAME}" --jq .sha) || [ -z "$TAG_SHA" ]; then
            echo "::error::Could not resolve the commit of tag ${TAG_NAME}."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${TAG_NAME} is ${TAG_SHA}, but this run started from ${HEAD_SHA}, so its provenance would name the wrong source. The release stays a draft. Run Rebuild Release from the tag: gh workflow run rebuild-release.yaml --ref ${TAG_NAME} -f image=${IMAGE_NAME} -f version=${VERSION}"
            exit 1
          fi

      - name: Free up disk space
        if: steps.verify.outputs.published != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Prepare build context
        id: context
        if: steps.verify.outputs.published != 'true'
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          # Optional build_context: build against another image's directory
          # using this image's own Dockerfile (variant images sharing sources).
          # metadata.yaml is optional and only variant images carry one.
          BUILD_CONTEXT=""
          if [ -f "$IMAGE_NAME/metadata.yaml" ]; then
            BUILD_CONTEXT=$(yq -r '.build_context // ""' "$IMAGE_NAME/metadata.yaml")
          fi
          if [ -n "$BUILD_CONTEXT" ]; then
            if ! echo "$BUILD_CONTEXT" | grep -qE '^[a-zA-Z0-9_-]+$'; then
              echo "::error::Invalid build_context format in $IMAGE_NAME/metadata.yaml: $BUILD_CONTEXT"
              exit 1
            fi
            if [ ! -d "$BUILD_CONTEXT" ]; then
              echo "::error::build_context directory does not exist: $BUILD_CONTEXT"
              exit 1
            fi
            echo "::notice::Building $IMAGE_NAME from context $BUILD_CONTEXT"
            echo "path=$BUILD_CONTEXT" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$IMAGE_NAME/Dockerfile" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "path=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$IMAGE_NAME/Dockerfile" >> "$GITHUB_OUTPUT"

      - name: Generate flavor files
        if: steps.verify.outputs.published != 'true'
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          if [ -f "$IMAGE_NAME/flavor.yaml" ]; then
            echo "::notice::Found flavor.yaml, generating Dockerfile and test.sh"
            # --require-hashes pins the exact wheels; --only-binary blocks
            # setup.py execution from source distributions
            pip install -q --require-hashes --only-binary :all: \
              -r megalinter-factory/requirements.txt
            python megalinter-factory/generate.py "$IMAGE_NAME"
          fi

      - name: Verify Dockerfile exists
        if: steps.verify.outputs.published != 'true'
        env:
          DOCKERFILE: ${{ steps.context.outputs.dockerfile }}
        run: |
          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::No Dockerfile found at $DOCKERFILE"
            exit 1
          fi

      - name: Resolve test command
        id: test
        if: steps.verify.outputs.published != 'true'
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          if ! echo "$IMAGE_NAME" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "::error::Invalid image name: $IMAGE_NAME"
            exit 1
          fi
          if [ -f "$IMAGE_NAME/test.sh" ]; then
            echo "command=bash ./$IMAGE_NAME/test.sh \"\$IMAGE_REF\"" >> "$GITHUB_OUTPUT"
          else
            echo "No test script found at $IMAGE_NAME/test.sh, skipping"
          fi

      - name: Build image
        id: build
        if: steps.verify.outputs.published != 'true'
        uses: anthony-spruyt/repo-operator/.github/actions/build-image@main
        with:
          image: ${{ inputs.image }}
          context: ${{ steps.context.outputs.path }}
          dockerfile: ${{ steps.context.outputs.dockerfile }}
          push: ${{ inputs.push }}
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          extra-tags: type=sha,prefix=
          dockerhub-namespace: aspruyt
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          test-command: ${{ steps.test.outputs.command }}

      # Must stay last: on failure the release stays a draft, so a published release always has an image.
      - name: Publish release
        if: inputs.push && steps.verify.outputs.published != 'true'
        uses: anthony-spruyt/repo-operator/.github/actions/publish-release@main
        with:
          tag: ${{ inputs.tag-name }}
          image-ref: ${{ steps.build.outputs.image-ref }}
          digest: ${{ steps.build.outputs.digest }}
