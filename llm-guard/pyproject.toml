[project]
name = "llm-guard"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.153.0",
    "uvicorn[standard]==0.54.0",
    "transformers==5.21.0",
    "tokenizers==0.23.3",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

# One variant per image; both are locked together in uv.lock.
[dependency-groups]
cpu = ["torch==2.14.1+cpu"]
cu130 = ["torch==2.14.1+cu130"]

[tool.uv]
package = false
exclude-newer = "7 days"
no-build = true
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130" },
]

# explicit: only torch comes from these indexes, whose copies of other packages carry no hashes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
