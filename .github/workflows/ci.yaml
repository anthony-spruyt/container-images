---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      # Image files
      - "**/Dockerfile"
      - "**/metadata.yaml"
      - "**/flavor.yaml"
      - "**/assets/**"
      - "**/app/**"
      - "**/.rebuild-stamp"
      # MegaLinter factory (triggers all flavor rebuilds)
      - "megalinter-factory/**"
      - ".github/workflows/_build-image.yaml"
      - "test-images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (directory name, e.g., 'chrony')"
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write
  packages: write
  pull-requests: write
  security-events: "write"
  statuses: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  lint:
    if: github.event_name != 'push'
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@main"
    secrets: "inherit"

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          # Variant images build from another image's directory via
          # build_context in metadata.yaml and may have no sources of their
          # own, so a change to the source directory must fan out to them.
          add_build_context_dependents() {
            local changed="$1"
            local dependents=""
            for metadata in */metadata.yaml; do
              local ctx dir
              [ -f "$metadata" ] || continue
              ctx=$(yq -r '.build_context // ""' "$metadata")
              [ -n "$ctx" ] || continue
              dir="${metadata%/metadata.yaml}"
              if echo "$changed" | grep -qxF "$ctx"; then
                dependents="${dependents}${dir}"$'\n'
              fi
            done
            printf '%s\n%s' "$changed" "$dependents" | sort -u | grep -v '^$' || true
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual dispatch: use specified image
            if ! echo "$INPUT_IMAGE" | grep -qE '^[a-zA-Z0-9_-]+$'; then
              echo "::error::Invalid image name format"
              exit 1
            fi
            if [ ! -d "$INPUT_IMAGE" ]; then
              echo "::error::Image directory does not exist: $INPUT_IMAGE"
              exit 1
            fi
            echo "images=[\"$INPUT_IMAGE\"]" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for image: $INPUT_IMAGE"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_FILES=$(git diff --name-only origin/main...HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Collect changed images from direct file changes
          DIRECT_CHANGES=$(echo "$DIFF_FILES" | \
            grep -E '^[a-zA-Z0-9_-]+/(Dockerfile|test\.sh|assets/|app/|metadata\.yaml|flavor\.yaml|\.rebuild-stamp)' | \
            cut -d'/' -f1 | sort -u | \
            while read -r img; do if [ -d "$img" ]; then echo "$img"; fi; done)
          DIRECT_CHANGES=$(add_build_context_dependents "$DIRECT_CHANGES")

          # If megalinter-factory changed, add all flavor directories
          if echo "$DIFF_FILES" | grep -qE '^megalinter-factory/'; then
            echo "MegaLinter factory changed - adding all flavors to build"
            FLAVOR_DIRS=$(find . -maxdepth 2 -name 'flavor.yaml' -printf '%h\n' | sed 's|^\./||')
            ALL_IMAGES=$(printf '%s\n%s' "$DIRECT_CHANGES" "$FLAVOR_DIRS" | sort -u | grep -v '^$')
          else
            ALL_IMAGES="$DIRECT_CHANGES"
          fi

          CHANGED=$(echo "$ALL_IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          echo "Changed images: ${CHANGED:-[]}"

  # Build only, never push. release-please owns publishing.
  # This job must declare the same permissions _build-image.yaml requests —
  # a narrower set fails the whole workflow file at run creation, it does not
  # downgrade.
  build:
    name: Build ${{ matrix.image }}
    needs: [detect-changes, lint]
    # Run if we have images AND (lint passed OR lint was skipped for renovate)
    if: |
      always() &&
      needs.detect-changes.outputs.images != '[]' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/_build-image.yaml
    secrets: inherit
    with:
      image: ${{ matrix.image }}
      push: false
      version: ""
      tag-name: ""

  # Summary job for branch protection - add jobs to 'needs' array
  summary:
    needs:
      - detect-changes
      - lint
      - build
    if: "always()"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@main"
