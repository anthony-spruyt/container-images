---
name: spruyt-labs
description: "MegaLinter for spruyt-labs - Go, Terraform, TypeScript, and infrastructure repositories"

# renovate: datasource=docker depName=ghcr.io/oxsecurity/megalinter-go
upstream_image: "ghcr.io/oxsecurity/megalinter-go:v10.2.0@sha256:e676b8e9dac00d148bf1abb6ab809f1df76f07e804d8061f78631975d0c90925"

languages:
  - docker
  - terraform

# Biome is not in MegaLinter upstream; its descriptor ships in mega-linter-plugin-biome/
# renovate: datasource=npm depName=@biomejs/biome
biome_version: "2.6.6"

extra_dockerfile: |
  ARG BIOME_VERSION={{ flavor.biome_version }}
  RUN npm install -g @biomejs/biome@${BIOME_VERSION} && npm cache clean --force && rm -rf /root/.npm/_cacache
  COPY mega-linter-plugin-biome/biome.megalinter-descriptor.yml /megalinter-descriptors/biome.megalinter-descriptor.yml

extra_test_linters:
  - name: biome
    version_command: "biome --version"
