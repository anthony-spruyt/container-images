---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Build Image

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (directory, also the GHCR package name)"
        required: true
        type: string
      push:
        description: "Publish the image and the release. Off for pull request checks. The caller must grant contents, packages, id-token and attestations write."
        required: false
        type: boolean
        default: false
      version:
        description: "Version to publish, without a leading v (e.g., 1.0.7). Required when push is true."
        required: false
        type: string
        default: ""
      tag-name:
        description: "Git tag release-please created (e.g., llm-guard-cuda-1.0.16). Required when push is true."
        required: false
        type: string
        default: ""
      tag-prefix:
        description: "Prefix for the docker tag only ('' or 'v'). Downstream repos pin these."
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        description: "Docker Hub token. Pass it only when push is true."
        required: false
    outputs:
      digest:
        description: "Image digest (empty unless push is true)"
        value: ${{ jobs.publish.outputs.digest }}

concurrency:
  group: build-${{ inputs.image }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ !inputs.push }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare build
        id: prepare
        uses: ./.github/actions/prepare-build
        with:
          image: ${{ inputs.image }}

      - name: Build image
        uses: anthony-spruyt/repo-operator/.github/actions/build-image@7bf816527b748801f0ac22002211ecdd00c2f64c # main
        with:
          image: ${{ inputs.image }}
          context: ${{ steps.prepare.outputs.context }}
          dockerfile: ${{ steps.prepare.outputs.dockerfile }}
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          extra-tags: type=sha,prefix=
          dockerhub-namespace: aspruyt
          test-command: ${{ steps.prepare.outputs.test-command }}

  publish:
    name: Build and publish
    if: inputs.push
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # No permissions block on purpose: requesting write here fails read-only PR callers at startup, even though the job is skipped.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The provenance attestation always names the run's commit (github.sha), so build only that commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag is the commit being built
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image }}
          TAG_NAME: ${{ inputs.tag-name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$TAG_NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::tag-name and version are required when push is true"
            exit 1
          fi
          if ! DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft); then
            echo "::error::No release found for ${TAG_NAME}."
            exit 1
          fi
          case "$DRAFT" in
            true) ;;
            false)
              echo "::notice::Release ${TAG_NAME} is already published; skipping the build"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unexpected isDraft '${DRAFT}' for ${TAG_NAME}"
              exit 1
              ;;
          esac
          if ! TAG_SHA=$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG_NAME}" --jq .sha) || [ -z "$TAG_SHA" ]; then
            echo "::error::Could not resolve the commit of tag ${TAG_NAME}."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${TAG_NAME} is ${TAG_SHA}, but this run started from ${HEAD_SHA}, so its provenance would name the wrong source. The release stays a draft. Run Rebuild Release from the tag: gh workflow run rebuild-release.yaml --ref ${TAG_NAME} -f image=${IMAGE_NAME} -f version=${VERSION}"
            exit 1
          fi


      - name: Prepare build
        id: prepare
        if: steps.verify.outputs.published != 'true'
        uses: ./.github/actions/prepare-build
        with:
          image: ${{ inputs.image }}

      - name: Build and push image
        id: build
        if: steps.verify.outputs.published != 'true'
        uses: anthony-spruyt/repo-operator/.github/actions/build-image@7bf816527b748801f0ac22002211ecdd00c2f64c # main
        with:
          image: ${{ inputs.image }}
          context: ${{ steps.prepare.outputs.context }}
          dockerfile: ${{ steps.prepare.outputs.dockerfile }}
          push: "true"
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          extra-tags: type=sha,prefix=
          dockerhub-namespace: aspruyt
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          test-command: ${{ steps.prepare.outputs.test-command }}

      # Must stay last: on failure the release stays a draft, so a published release always has an image.
      - name: Publish release
        if: steps.verify.outputs.published != 'true'
        uses: anthony-spruyt/repo-operator/.github/actions/publish-release@7bf816527b748801f0ac22002211ecdd00c2f64c # main
        with:
          tag: ${{ inputs.tag-name }}
          image-ref: ${{ steps.build.outputs.image-ref }}
          digest: ${{ steps.build.outputs.digest }}
