---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Rebuild MegaLinter Flavors

# Weekly refresh to pick up new linter versions from MegaLinter.
# Linter versions are extracted dynamically at build time, so the flavors only
# need a reason to rebuild — that reason is a stamp file per flavor. Bumping the
# stamps in a PR lets release-please cut a patch release per flavor, which is
# what actually triggers the builds.
on:
  schedule:
    - cron: "0 4 * * 0" # Weekly on Sunday at 4 AM UTC
  workflow_dispatch: # Manual trigger

permissions: {}

jobs:
  refresh:
    name: Open refresh pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      # Needs the app token, not GITHUB_TOKEN: a GITHUB_TOKEN pull request does
      # not trigger the status checks that pr-rules requires, so it could never
      # merge.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Find flavor directories
        id: find
        run: |
          # Find all directories containing flavor.yaml
          FLAVORS=$(find . -maxdepth 2 -name 'flavor.yaml' -printf '%h\n' | \
            sed 's|^\./||' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found flavors: $FLAVORS"
          echo "flavors=$FLAVORS" >> "$GITHUB_OUTPUT"

      - name: Stamp each flavor
        env:
          FLAVORS: ${{ steps.find.outputs.flavors }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          echo "$FLAVORS" | jq -r '.[]' | while read -r flavor; do
            echo "$STAMP" > "${flavor}/.rebuild-stamp"
            echo "Stamped $flavor with $STAMP"
          done

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "::notice::Stamps are already current, nothing to do"
            exit 0
          fi

          BRANCH="chore/megalinter-refresh-$(date -u +%Y%m%d)"
          git config user.name "repo-operator-release-bot[bot]"
          git config user.email "repo-operator-release-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -aqm "chore(megalinter): weekly linter version refresh"
          git push -q origin "$BRANCH"

          gh pr create \
            --title "chore(megalinter): weekly linter version refresh" \
            --body "Bumps each flavor's rebuild stamp so release-please cuts a patch release and the images rebuild against the current linter versions." \
            --base main \
            --head "$BRANCH"
