---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Container Retention Policy

on:
  schedule:
    - cron: "0 5 * * 0" # Weekly, Sundays at 5 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no deletions)"
        type: boolean
        default: true

permissions: {}

jobs:
  collect-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.packages.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect packages
        id: packages
        run: |
          echo "list=$(jq -r '.packages | keys | join(",")' release-please-config.json)" >> "$GITHUB_OUTPUT"

  cleanup-containers:
    needs: collect-packages
    permissions:
      packages: write
    uses: anthony-spruyt/repo-operator/.github/workflows/_container-retention.yaml@main
    with:
      packages: ${{ needs.collect-packages.outputs.list }}
      # Schedule stays dry until one real dispatch under GITHUB_TOKEN has been checked
      dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

  cleanup-releases:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GARBO_CLIENT_ID }}
          private-key: ${{ secrets.GARBO_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          CUTOFF_DATE=$(date -d '4 weeks ago' +%s)
          KEEP_N=5

          # Tags naming a version release-please still considers current must
          # survive regardless of age: deleting one would make release-please
          # lose its version anchor and recut a version that already shipped.
          CURRENT_TAGS=$(jq -r --slurpfile cfg release-please-config.json '
            to_entries[]
            | .key as $c
            | "\($c)-\(if $cfg[0].packages[$c]["include-v-in-tag"] then "v" else "" end)\(.value)"
          ' .release-please-manifest.json)

          COMPONENTS=$(jq -r '.packages | keys[]' release-please-config.json)

          for COMPONENT in $COMPONENTS; do
            echo "Processing releases for component: $COMPONENT"

            # Anchor on the version that follows, so llm-guard does not swallow
            # the releases belonging to llm-guard-cuda.
            RELEASES=$(gh release list --repo ${{ github.repository }} --limit 1000 \
              --json tagName,createdAt \
              --jq ".[] | select(.tagName | test(\"^${COMPONENT}-v?[0-9]\"))")

            # Count and track for keeping N most recent
            COUNT=0

            echo "$RELEASES" | jq -c '.' | while read -r RELEASE; do
              TAG=$(echo "$RELEASE" | jq -r '.tagName')
              CREATED=$(echo "$RELEASE" | jq -r '.createdAt')
              CREATED_TS=$(date -d "$CREATED" +%s)

              COUNT=$((COUNT + 1))

              # Keep N most recent regardless of age
              if [ "$COUNT" -le "$KEEP_N" ]; then
                echo "Keeping (recent): $TAG"
                continue
              fi

              # Keep whatever release-please currently points at
              if echo "$CURRENT_TAGS" | grep -qxF "$TAG"; then
                echo "Keeping (current release-please version): $TAG"
                continue
              fi

              # Delete if older than cutoff
              if [ "$CREATED_TS" -lt "$CUTOFF_DATE" ]; then
                if [ "$DRY_RUN" = "true" ]; then
                  echo "Would delete: $TAG (created: $CREATED)"
                else
                  echo "Deleting: $TAG (created: $CREATED)"
                  gh release delete "$TAG" --repo ${{ github.repository }} --cleanup-tag --yes
                fi
              else
                echo "Keeping (not old enough): $TAG"
              fi
            done
          done
