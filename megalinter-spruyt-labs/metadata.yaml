---
free-disk: true
watch:
  - megalinter-factory/
prepare-command: >-
  pip install -q --require-hashes --only-binary :all: -r megalinter-factory/requirements.txt
  && python megalinter-factory/generate.py megalinter-spruyt-labs
test-command: bash ./megalinter-spruyt-labs/test.sh "$IMAGE_REF"
egress:
  - dl-cdn.alpinelinux.org:443
  - files.pythonhosted.org:443
  - pypi.org:443
  - registry.npmjs.org:443
