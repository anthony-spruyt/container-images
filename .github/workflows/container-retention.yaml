# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Container Retention"
on:
  schedule:
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting it"
        type: "boolean"
        default: true
permissions: {}
jobs:
  cleanup:
    permissions:
      packages: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_container-retention.yaml@6d50fa5ce20ffc1c29c38ee7c2ff44fb86127777"
    with:
      packages: "chrony,claude-agent-read,claude-agent-spruyt-labs,claude-agent-write,coder-gitops,devcontainer-common,happy-server,llm-guard,llm-guard-cuda,megalinter-base,megalinter-cpp,megalinter-go,megalinter-python,megalinter-spruyt-labs,megalinter-typescript,ssh-key-rotation"
      dry-run: "${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}"
