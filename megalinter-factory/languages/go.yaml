---
linters:
  - GO_GOLANGCI_LINT

# Upstream's go flavor installs Go from apk, which trails the go directive our modules declare
# renovate: datasource=docker depName=golang
go_image: "docker.io/library/golang:1.27.3-alpine@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb"

# GOTOOLCHAIN=local: a newer go directive must fail the run, not download a toolchain golangci-lint cannot load
# GOMODCACHE: the default under /go is root-owned, and lint.sh runs the container as the host user
extra_dockerfile: |
  COPY --link --from={{ language.go_image }} /usr/local/go /usr/lib/go
  ENV GOTOOLCHAIN=local \
      GOMODCACHE=/tmp/go/mod

extra_test_linters:
  - name: go
    version_command: "go version"

extra_test_env_vars:
  - name: GOTOOLCHAIN
    contains: "local"
