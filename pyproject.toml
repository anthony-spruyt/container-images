[tool.ruff]
extend = "ruff-base.toml"
target-version = "py312"
src = ["megalinter-factory", "llm-guard/app", "llm-tool-guard/app", "llm-tool-guard/tests"]

[tool.ruff.lint]
extend-select = ["PLR"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004"] # expected values in assertions read better inline
