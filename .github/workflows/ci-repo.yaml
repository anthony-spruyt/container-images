# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Repo-owned CI jobs; ci.yaml calls this after lint. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md

name: "CI (repo)"
on:
  workflow_call: {}
permissions: {}
jobs:
  factory-tests:
    name: "MegaLinter Factory Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "audit"

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run tests"
        run: |
          pip install -q --require-hashes --only-binary :all: \
            -r megalinter-factory/requirements.txt \
            -r megalinter-factory/requirements-test.txt
          python -m pytest megalinter-factory/ -q
