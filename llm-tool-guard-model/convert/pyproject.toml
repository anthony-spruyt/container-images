[project]
name = "llm-tool-guard-model-convert"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "torch==2.15.0+cpu",
    "transformers==5.20.2",
    "openvino==2026.4.1",
    "numpy==2.5.4",
]

[tool.uv]
package = false
exclude-newer = "7 days"
no-build = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# explicit: only torch comes from this index, whose copies of other packages carry no hashes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
